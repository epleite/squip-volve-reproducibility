[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqigpi"
version = "1.0.0"
description = "Scale-quotient information geometry for seismic-petrophysical inversion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Emilson Pereira Leite"}]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
